        <textarea id="textContent" rows="5" cols="70">These are short, famous texts in English from classic sources like the Bible or Shakespeare. Some texts have word definitions and explanations to help you. Some of these texts are written in an old style of English. Try to understand them, because the English that we speak today is based on what our great, great, great, great grandparents spoke before! Of course, not all these texts were originally written in English. The Bible, for example, is a translation. But they are all well known in English today, and many of them express beautiful thoughts.

I MET A TRAVELLER from an antique land
Who said: Two vast and trunkless legs of stone
Stand in the desert. Near them on the sand,
Half sunk, a shattered visage lies, whose frown
And wrinkled lip and sneer of cold command
Tell that its sculptor well those passions read
Which yet survive, stamped on these lifeless things,
The hand that mocked them and the heart that fed.
And on the pedestal these words appear:
"My name is Ozymandias, King of Kings:
Look on my works, ye mighty, and despair!"
Nothing beside remains. Round the decay
Of that colossal wreck, boundless and bare,
The lone and level sands stretch far away.

Tiger! Tiger! burning bright
In the forests of the night,
What immortal hand or eye
Could frame thy fearful symmetry?

In what distant deeps or skies
Burnt the fire of thine eyes?
On what wings dare he aspire?
What the hand dare seize the fire?

And what shoulder, and what art,
Could twist the sinews of thy heart?
And when thy heart began to beat,
What dread hand? and what dread feet?

What the hammer? what the chain?
In what furnace was thy brain?
What the anvil? what dread grasp
Dare its deadly terrors clasp?

When the stars threw down their spears,
And watered heaven with their tears,
Did he smile his work to see?
Did he who made the Lamb make thee?

Tiger! Tiger! burning bright
In the forests of the night,
What immortal hand or eye
Dare frame thy fearful symmetry?

Be slowly lifted up, thou long black arm,
Great Gun towering towards Heaven, about to curse;
Sway steep against them, and for years rehearse
Huge imprecations like a blasting charm!
Reach at that Arrogance which needs thy harm,
And beat it down before its sins grow worse.
Spend our resentment, cannon,-yea, disburse
Our gold in shapes of flame, our breaths in storm.

Yet, for men's sakes whom thy vast malison
Must wither innocent of enmity,
Be not withdrawn, dark arm, the spoilure done,
Safe to the bosom of our prosperity.
But when thy spell be cast complete and whole,
May God curse thee, and cut thee from our soul!</textarea>
